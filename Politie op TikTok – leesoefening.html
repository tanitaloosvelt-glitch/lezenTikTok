<!doctype html>
<html lang="nl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Politie op TikTok – leesoefening</title>
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light;--bg:#f4f6fb;--card:#fff;--tx:#1b1f2a;--mu:#5b6472;--ac:#3a5bd9;--acx:#fff;--ok:#17703d;--okb:#e1f4e8;--no:#b0301f;--nob:#fdeceb;--inf:#eef2ff;--bd:#d6dbe6}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;--bg:#14171f;--card:#1e222d;--tx:#eef0f5;--mu:#a5adbb;--ac:#8aa2ff;--acx:#10131c;--ok:#6fdc98;--okb:#173222;--no:#ff9a8f;--nob:#3a1f1d;--inf:#242b45;--bd:#343a49}}
:root[data-theme="dark"]{color-scheme:dark;--bg:#14171f;--card:#1e222d;--tx:#eef0f5;--mu:#a5adbb;--ac:#8aa2ff;--acx:#10131c;--ok:#6fdc98;--okb:#173222;--no:#ff9a8f;--nob:#3a1f1d;--inf:#242b45;--bd:#343a49}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
header{padding:20px 16px 8px;max-width:820px;margin:auto}
h1{font-size:1.5rem;margin:0 0 4px}
header p{margin:0;color:var(--mu)}
nav{display:flex;gap:6px;overflow-x:auto;max-width:820px;margin:8px auto;padding:4px 16px}
nav button{flex:none;border:1px solid var(--bd);background:var(--card);color:var(--tx);padding:8px 12px;border-radius:999px;font:inherit;font-size:.9rem;cursor:pointer}
nav button.on{background:var(--ac);color:var(--acx);border-color:var(--ac)}
main{max-width:820px;margin:auto;padding:0 16px 40px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin:12px 0}
.q{font-weight:600;margin:0 0 10px}
.opt,.row{display:block;padding:8px 10px;border:1px solid var(--bd);border-radius:8px;margin:6px 0;cursor:pointer}
.opt:hover{border-color:var(--ac)}
.row{cursor:default;display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.row .tfc label{margin-right:12px;cursor:pointer}
textarea,select{width:100%;font:inherit;color:var(--tx);background:var(--bg);border:1px solid var(--bd);border-radius:8px;padding:8px}
select{width:auto;max-width:100%}
.row.m select{flex:1 1 260px}
.b{background:var(--ac);color:var(--acx);border:0;border-radius:8px;padding:9px 16px;font:inherit;cursor:pointer;margin-top:10px}
.b:disabled{opacity:.5;cursor:default}
.b.alt{background:transparent;color:var(--ac);border:1px solid var(--ac);margin-right:6px}
.fb{margin-top:10px;border-radius:8px;padding:0}
.fb.ok,.fb.no,.fb.info{padding:10px 12px}
.fb.ok{background:var(--okb);color:var(--ok)}.fb.no{background:var(--nob);color:var(--no)}.fb.info{background:var(--inf)}
.fb ul{margin:4px 0 0;padding-left:18px}.fb li.ok{color:var(--ok)}.fb li.no{color:var(--no)}
.bank{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.bank span{background:var(--inf);border-radius:999px;padding:3px 10px;font-size:.9rem}
.note{background:var(--inf);border-radius:10px;padding:12px 14px}
.bar{height:12px;background:var(--bd);border-radius:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--ok)}
details{margin:6px 0}summary{cursor:pointer;font-weight:600}
h2{font-size:1.2rem;margin:16px 0 4px}
.sub{color:var(--mu);margin:0 0 8px}
</style>
</head>
<body>
<header>
<h1>🚓 Politie op TikTok</h1>
<p>Leesoefening voor het eerste middelbaar · naar een artikel uit Het Nieuwsblad</p>
</header>
<nav id="nav"></nav>
<main id="main"></main>

<script>
const $=(s,r=document)=>r.querySelector(s);
const R={};
const sh=a=>a.map(x=>[Math.random(),x]).sort((p,q)=>p[0]-q[0]).map(x=>x[1]);
const card=h=>{const d=document.createElement('div');d.className='card';d.innerHTML=h;return d};
const fb=(n,ok,m)=>{const f=$('.fb',n);f.className='fb '+(ok?'ok':'no');f.innerHTML=m};
const lock=n=>n.querySelectorAll('input,select,.chk').forEach(e=>e.disabled=true);

const B={
mc(i,k,n){
  n.innerHTML=`<p class="q">${i.q}</p>`+i.o.map((o,x)=>`<label class="opt"><input type="radio" name="${k}" value="${x}"> ${o}</label>`).join('')+'<button class="b chk">Controleer</button><div class="fb"></div>';
  R[k]={got:0,max:1};
  $('.chk',n).onclick=()=>{const s=$('input:checked',n);if(!s)return fb(n,false,'Kies eerst een antwoord.');
    const ok=+s.value===i.a;R[k].got=ok?1:0;lock(n);
    fb(n,ok,ok?'Juist! '+(i.w||''):'Niet helemaal. Het juiste antwoord is: <b>'+i.o[i.a]+'</b>. '+(i.w||''))};
},
open(i,k,n){
  n.innerHTML=`<p class="q">${i.q}</p><textarea rows="3" placeholder="Schrijf je antwoord hier…"></textarea><button class="b chk">Toon voorbeeldantwoord</button><div class="fb"></div>`;
  if(!i.p)R[k]={got:0,max:1};
  $('.chk',n).onclick=e=>{e.target.disabled=true;const f=$('.fb',n);f.className='fb info';
    f.innerHTML=(i.p?'<b>Tip:</b> ':'<b>Voorbeeldantwoord:</b> ')+i.m+(i.p?'':'<div class="self"><p style="margin:8px 0 0">Vergelijk met jouw antwoord:</p><button class="b alt s1">Dat klopt</button><button class="b alt s0">Nog niet helemaal</button></div>');
    if(!i.p){$('.s1',n).onclick=()=>{R[k].got=1;$('.self',n).innerHTML='✔ Genoteerd, goed zo!'};
      $('.s0',n).onclick=()=>{R[k].got=0;$('.self',n).innerHTML='Geen probleem: zoek de zin nog eens op in de tekst.'}}};
},
tf(i,k,n){
  n.innerHTML=`<p class="q">${i.q}</p>`+i.r.map((r,x)=>`<div class="row"><span>${r[0]}</span><span class="tfc"><label><input type="radio" name="${k}${x}" value="1"> Waar</label><label><input type="radio" name="${k}${x}" value="0"> Niet waar</label></span></div>`).join('')+'<button class="b chk">Controleer</button><div class="fb"></div>';
  R[k]={got:0,max:i.r.length};
  $('.chk',n).onclick=()=>{let g=0,l=[];
    for(let x=0;x<i.r.length;x++){if(!$(`input[name="${k}${x}"]:checked`,n))return fb(n,false,'Beantwoord alle uitspraken.')}
    i.r.forEach((r,x)=>{const ok=($(`input[name="${k}${x}"]:checked`,n).value==='1')===r[1];if(ok)g++;
      l.push(`<li class="${ok?'ok':'no'}">${ok?'✔':'✘'} ${r[1]?'Waar.':'Niet waar. '+r[2]}</li>`)});
    R[k].got=g;lock(n);fb(n,g===i.r.length,`<b>${g} op ${i.r.length}</b><ul>${l.join('')}</ul>`)};
},
sel(i,k,n){
  const opts=sh(i.o);const S=(x)=>`<select data-x="${x}"><option value="">– kies –</option>${opts.map(o=>`<option>${o}</option>`).join('')}</select>`;
  n.innerHTML=`<p class="q">${i.q}</p>`+(i.bank?'<div class="bank">'+opts.map(o=>`<span>${o}</span>`).join('')+'</div>':'')+
   i.r.map((r,x)=>i.bank?`<div class="row m"><span>${r[0].replace('___',S(x))}</span></div>`:`<div class="row m"><b>${r[0]}</b>${S(x)}</div>`).join('')+'<button class="b chk">Controleer</button><div class="fb"></div>';
  R[k]={got:0,max:i.r.length};
  $('.chk',n).onclick=()=>{const ss=[...n.querySelectorAll('select')];if(ss.some(s=>!s.value))return fb(n,false,'Vul overal een antwoord in.');
    let g=0,l=[];ss.forEach((s,x)=>{const ok=s.value===i.r[x][1];if(ok)g++;else l.push(`<li class="no">${i.bank?i.r[x][0].replace('___','<b>'+i.r[x][1]+'</b>'):'<b>'+i.r[x][0]+'</b>: '+i.r[x][1]}</li>`)});
    R[k].got=g;lock(n);fb(n,g===i.r.length,`<b>${g} op ${i.r.length}</b>`+(l.length?'<br>Dit moet het zijn:<ul>'+l.join('')+'</ul>':' Prima gedaan!'))};
}};

const D=[
{id:'s0',t:'Start',h:`
 <div class="card"><h2>Zo werkt het</h2>
 <p>Je leest eerst het artikel <b>“Wat rest van overheid niet mag, mag politie wél: op TikTok zitten”</b> (Het Nieuwsblad, 7 augustus 2026). Daarna maak je de oefeningen in de tabbladen hierboven. Je krijgt meteen feedback.</p>
 <div class="note"><b>Lees nu de tekst.</b> Je leerkracht geeft je het artikel (Focusversie) of plaatst het hier.</div>
 <!-- LEERKRACHT: plak hier eventueel de tekst of een link naar het artikel, bv. <div class="note">…</div> -->
 </div>
 <div class="card"><h2>Achtergrondinfo bij de tekst</h2>
 <details><summary>1 · MR</summary>Een Franstalige liberale politieke partij in België. Bernard Quintin hoort bij die partij.</details>
 <details><summary>2 · Nauwe linken met de Chinese overheid</summary>TikTok is van ByteDance, een bedrijf uit China. De Chinese overheid bezit TikTok niet, maar Chinese bedrijven kunnen wettelijk verplicht worden om informatie met de overheid te delen.</details>
 <details><summary>3 · de Staatsveiligheid</summary>De Belgische inlichtingendienst. Ze onderzoekt bedreigingen voor de veiligheid van België, zoals spionage, terrorisme en buitenlandse inmenging.</details>
 <details><summary>4 · cyberveiligheid</summary>Computers, smartphones, netwerken en gegevens beschermen tegen hackers, virussen en gegevensdiefstal.</details>
 <details><summary>5 · VCLP (Vaste Commissie van de Lokale Politie)</summary>Dit orgaan vertegenwoordigt de Belgische politiezones en overlegt over zaken die voor meerdere zones belangrijk zijn.</details>
 </div>`},
{id:'s1',t:'Voor het lezen',d:'Denk na en schrijf op. Hier is geen punt op te verdienen.',i:[
 ['open',{p:1,q:'Welke sociale media gebruiken jongeren volgens jou het meest?',m:'Er is geen vast antwoord. Denk aan TikTok, Instagram, Snapchat, YouTube … Wat gebruik jij zelf?'}],
 ['open',{p:1,q:'Waarom zou de politie jongeren willen bereiken?',m:'Bijvoorbeeld om hen te waarschuwen voor gevaren, zoals alcohol in het verkeer of online oplichting.'}],
 ['open',{p:1,q:'Wat betekent privacy voor jou op sociale media?',m:'Je beslist zelf welke gegevens, foto’s en filmpjes je deelt en met wie.'}],
 ['open',{p:1,q:'Kijk de titel en de afbeeldingen goed na. Waarover zal de tekst volgens jou gaan?',m:'Over de politie die TikTok gebruikt, en misschien over de risico’s daarvan. Lees verder om te controleren of je gelijk had.'}]]},
{id:'s2',t:'Tijdens het lezen',d:'Focusvragen bij de eerste alinea’s en de rest van de tekst.',i:[
 ['mc',{q:'Welk risico van TikTok wordt in de eerste alinea genoemd?',o:['Het gevaar op Chinese spionage','Jongeren zitten te lang op hun gsm','Er wordt veel gepest in de reacties','De app is te duur voor de politie'],a:0,w:'Omdat TikTok Chinese roots heeft, vrezen veel landen dat gevoelige informatie naar China loopt.'}],
 ['mc',{q:'Wat betekent “omstreden” in de eerste alinea?',o:['Iets waar veel discussie of kritiek over bestaat','Iets wat nieuw en onbekend is','Iets wat verboden is voor kinderen','Iets wat erg goedkoop is'],a:0}],
 ['mc',{q:'Wie moet volgens alinea 2 en 3 extra opletten met TikTok?',o:['Alleen jongeren','Ambtenaren, militairen en politiemensen','Alle inwoners van België','Enkel leerkrachten'],a:1,w:'Zij mochten de app niet installeren op een diensttoestel.'}],
 ['open',{q:'Wat is een “vuil toestel”, volgens woordvoerder Amber Mach?',m:'Een telefoon die op geen enkele manier verbonden is met het politienetwerk en dat ook niet mag zijn.'}],
 ['open',{q:'Over welke twee preventieboodschappen maakt LaMa TikTok-filmpjes?',m:'Over afleiding achter het stuur van de wagen, en over goed op elkaar letten tijdens de hittegolven.'}],
 ['open',{p:1,q:'Kijk jij weleens na welke toegang een app op je gsm heeft (bv. camera en micro)? Waarom wel of niet?',m:'Een app die niet alles moet kunnen, hoeft ook geen toegang tot alles te krijgen. Je kan dit instellen in je telefoon.'}]]},
{id:'s3',t:'Woordenschat',d:'Oefen de moeilijke woorden uit de tekst.',i:[
 ['sel',{q:'Verbind elk woord met de juiste uitleg.',o:['iets waar veel discussie of kritiek over bestaat','het stiekem verzamelen van geheime of gevoelige informatie','heel voorzichtig en oplettend','een toestel dat iemand voor het werk gebruikt','afgescheiden van andere toestellen of systemen','ergens de nadruk op leggen','speels of grappig bedoeld','ouderwets'],
  r:[['omstreden','iets waar veel discussie of kritiek over bestaat'],['de spionage','het stiekem verzamelen van geheime of gevoelige informatie'],['omzichtig','heel voorzichtig en oplettend'],['het diensttoestel','een toestel dat iemand voor het werk gebruikt'],['geïsoleerd','afgescheiden van andere toestellen of systemen'],['beklemtonen','ergens de nadruk op leggen'],['ludiek','speels of grappig bedoeld'],['archaïsch','ouderwets']]}],
 ['sel',{bank:1,q:'Vul het juiste woord in.',o:['gevoelig','experimenteren','belerend','statistieken','cybercriminaliteit','sensibiliseren','preventie'],
  r:[['Een foto van je identiteitskaart is ___ informatie: die deel je niet zomaar.','gevoelig'],['De politiezone wil ___ met korte filmpjes: ze probeert uit wat werkt.','experimenteren'],['Een leraar die altijd streng de les leest, komt snel ___ over.','belerend'],['Uit de ___ blijkt dat veel meer mensen de filmpjes bekijken.','statistieken'],['Hacken en online oplichting vallen onder ___.','cybercriminaliteit'],['Met een campagne willen ze jongeren ___ voor de gevaren van drugs.','sensibiliseren'],['Goede ___ voorkomt problemen: beter vooraf waarschuwen dan achteraf straffen.','preventie']]}],
 ['mc',{q:'Wat betekent “geen toegevingen doen”?',o:['Je geeft alles weg','Je houdt vast aan je eigen standpunt of principes','Je geeft cadeautjes','Je antwoordt niet'],a:1}],
 ['mc',{q:'Welk woord betekent het tegenovergestelde van “ludiek”?',o:['grappig','speels','ernstig','vrolijk'],a:2}],
 ['mc',{q:'Wat betekent “sensibiliseren”?',o:['Mensen bewust maken van een probleem of gevaar','Mensen straffen','Mensen aan het lachen brengen','Mensen filmen'],a:0}]]},
{id:'s4',t:'Leesvragen',d:'Haal de antwoorden uit de tekst.',i:[
 ['mc',{q:'Waarnaar verwijst “dat platform” in de tweede alinea?',o:['TikTok','China','De Staatsveiligheid','Het politienetwerk'],a:0}],
 ['mc',{q:'Wat betekent “er omzichtig mee omspringen” (alinea 3)? Dat ze TikTok …',o:['alleen mogen gebruiken als de voordelen groter lijken dan de nadelen','voorlopig moeten vermijden tot andere sociale media minder bereik hebben','met aandacht voor mogelijke risico’s moeten behandelen','vooral moeten inzetten wanneer de privacy-instellingen streng genoeg zijn'],a:2}],
 ['open',{q:'Wat bedoelen ze met “een afzonderlijk en geïsoleerd toestel” (alinea 4)?',m:'Een toestel dat losstaat van en niet verbonden is met het politienetwerk.'}],
 ['mc',{q:'Waarom maakt minister Quintin een uitzondering voor lokale politiezones?',o:['Omdat politiezones TikTok al jarenlang verplicht gebruiken','Omdat TikTok volgens de Staatsveiligheid volledig veilig is','Omdat alle overheden opnieuw op TikTok mogen verschijnen','Omdat ze op Facebook en Instagram minder jongeren bereiken'],a:3}],
 ['open',{q:'Noteer twee veiligheidsmaatregelen die in de tekst genoemd worden.',m:'Bijvoorbeeld: een apart toestel gebruiken · de toestemming voor camera en micro beperken · de strengste privacy-instellingen aanzetten.'}],
 ['open',{q:'Waarom gebruikte politiezone LaMa al TikTok?',m:'Het bereik van hun preventieboodschappen via Facebook of Instagram nam almaar af.'}],
 ['tf',{q:'Waar of niet waar? Als de uitspraak niet klopt, lees je de verbetering.',r:[
   ['Ambtenaren en politiemensen mochten TikTok niet op diensttoestellen installeren.',1],
   ['LaMa gebruikt TikTok alleen voor ernstige en formele boodschappen.',0,'LaMa plaatst ook filmpjes met een ludiek randje om minder belerend of archaïsch over te komen.'],
   ['Ook Nederlandse en Duitse politiediensten gebruiken TikTok.',1],
   ['De app mag volgens de nieuwe regel zonder beperkingen op politietoestellen staan.',0,'De app mag alleen onder strikte voorwaarden gebruikt worden, onder meer op een afzonderlijk en geïsoleerd toestel.']]}],
 ['sel',{q:'Verbind de persoon of organisatie met de juiste rol in de tekst.',o:['staat TikTok door lokale politiezones onder voorwaarden toe','raadde overheden aan om voorzichtig om te gaan met TikTok','was betrokken bij overleg over het gebruik van TikTok door Belgische korpsen'],
  r:[['Bernard Quintin','staat TikTok door lokale politiezones onder voorwaarden toe'],['de Staatsveiligheid','raadde overheden aan om voorzichtig om te gaan met TikTok'],['de VCLP','was betrokken bij overleg over het gebruik van TikTok door Belgische korpsen']]}],
 ['mc',{q:'Welke zin vat de tekst het best samen?',o:['Ondanks eerdere veiligheidsbezwaren mogen lokale politiezones TikTok onder strikte voorwaarden gebruiken om vooral jongeren beter te bereiken.','Belgische politiezones mogen TikTok gebruiken omdat het platform volgens nieuwe adviezen minder veiligheidsrisico’s inhoudt dan vroeger.','Politiezones krijgen toestemming voor TikTok omdat sociale media de band tussen politie en samenleving automatisch versterken.','De Belgische overheid versoepelt haar algemene TikTokverbod omdat voorbeelden uit binnen- en buitenland aantonen dat het platform veilig is.'],a:0}],
 ['open',{p:1,q:'Vind jij het een goed idee dat politiezones TikTok mogen gebruiken om jongeren te bereiken, ondanks het gevaar op Chinese spionage? Leg uit waarom wel of niet.',m:'Dit is jouw mening. Geef een duidelijk standpunt én minstens één reden, bv. over het bereik bij jongeren of over de veiligheid.'}],
 ['open',{p:1,q:'Vind je dat politiezones op sociale media ook ludieke filmpjes mogen plaatsen, of moeten ze altijd ernstig en formeel communiceren? Verklaar je antwoord.',m:'Dit is jouw mening. Denk aan hoe je zelf reageert op filmpjes die belerend zijn, en aan wanneer humor past bij een ernstige boodschap.'}]]},
{id:'res',t:'Resultaat'}];

function build(){
  Object.keys(R).forEach(k=>delete R[k]);
  const nav=$('#nav'),main=$('#main');nav.innerHTML='';main.innerHTML='';
  D.forEach((s,x)=>{
    const b=document.createElement('button');b.textContent=s.t;b.onclick=()=>show(x);nav.appendChild(b);
    const p=document.createElement('section');p.id=s.id;p.hidden=true;
    if(s.h)p.innerHTML=s.h;
    else if(s.i){p.innerHTML=`<h2>${s.t}</h2><p class="sub">${s.d}</p>`;
      s.i.forEach((it,j)=>{const n=card('');B[it[0]](it[1],s.id+j,n);p.appendChild(n)})}
    main.appendChild(p);
  });
  show(0);
}
function show(x){
  document.querySelectorAll('#nav button').forEach((b,j)=>b.classList.toggle('on',j===x));
  document.querySelectorAll('main section').forEach((p,j)=>p.hidden=j!==x);
  if(D[x].id==='res')results();
  window.scrollTo(0,0);
}
function results(){
  let G=0,M=0,h='<h2>Jouw resultaat</h2>';
  D.filter(s=>s.i).forEach(s=>{
    let g=0,m=0;Object.keys(R).filter(k=>k.startsWith(s.id)&&k[s.id.length]!==undefined).forEach(k=>{g+=R[k].got;m+=R[k].max});
    if(!m)return;G+=g;M+=m;
    h+=`<div class="card"><b>${s.t}</b>: ${g} op ${m}<div class="bar"><i style="width:${g/m*100}%"></i></div></div>`;
  });
  const pc=M?Math.round(G/M*100):0;
  h+=`<div class="card"><p class="q">Totaal: ${G} op ${M} (${pc}%)</p><p>${pc>=80?'Sterk gewerkt! Je begrijpt de tekst goed.':pc>=50?'Goed bezig! Lees de vragen die je fout had nog eens na in de tekst.':'Lees de tekst nog eens rustig en probeer opnieuw. Je kan het!'}</p><p class="sub">Vragen die je nog niet maakte tellen als 0. Persoonlijke meningsvragen tellen niet mee.</p><button class="b" id="again">Opnieuw beginnen</button></div>`;
  $('#res').innerHTML=h;$('#again').onclick=build;
}
build();
</script>
</body>
</html>
